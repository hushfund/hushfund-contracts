[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 1
bytecode_hash = "none"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# The deploy script reads ../config/<network>.json and writes ../deployments/<network>.json
fs_permissions = [{ access = "read", path = "../config" }, { access = "write", path = "../deployments" }]

[profile.default.fuzz]
runs = 256

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
