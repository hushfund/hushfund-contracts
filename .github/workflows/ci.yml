name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  solidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge build
        working-directory: contracts
      - run: forge test
        working-directory: contracts
